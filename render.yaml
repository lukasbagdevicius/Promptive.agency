services:
  - type: web
    name: promptive-agency-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host=0.0.0.0 --port=$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: true
      - key: OPENAI_API_KEY
        sync: false 